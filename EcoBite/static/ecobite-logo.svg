<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="EcoBite logo">
  <defs>
    <!-- the "bite" taken out of the leaf -->
    <mask id="bite">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="49" cy="18" r="8.5" fill="#000"/>
    </mask>
  </defs>

  <rect width="64" height="64" rx="16" fill="#1f7a4d"/>

  <!-- leaf -->
